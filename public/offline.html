<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7CC46" />
    <title>You're offline · StudyPlan Analyzer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        background: #faf9f6;
        color: #000;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 12px 0 0;
        font-size: 16px;
        line-height: 1.6;
        color: #65615d;
      }
      button {
        margin-top: 28px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #f7cc46;
        color: #000;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" width="72" height="72" />
      <h1>You&rsquo;re offline</h1>
      <p>
        StudyPlan needs the internet to show your child&rsquo;s plan. Check your
        connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
